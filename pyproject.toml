[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tb-guard-ml"
version = "0.1.0"
description = "Reproducible audio ML research pipeline & acoustic event simulation for TB-Guard public-health screening"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TB-Guard Research Engineering Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "matplotlib>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
